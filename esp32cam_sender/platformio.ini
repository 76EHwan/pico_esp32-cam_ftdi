; Build and flash the ESP32-CAM sketch with PlatformIO.
;
;   pio run                 compile
;   pio run -t upload       compile and flash through the RP2040 bridge
;
; Before uploading: jumper the RP2040's GP3 to GND, press the ESP32-CAM's own
; RST button underneath, and close the viewer so the port is free. Afterwards
; remove the jumper and press RST again - IO0 is the camera's XCLK.
;
; src_dir points at this folder so the sketch keeps its Arduino layout and the
; Arduino IDE can still open it.

[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; The camera driver does not fit the default partition table.
board_build.partitions = huge_app.csv

; The bridge port (interface 0). `uv run ../tools/viewer.py --list` labels them.
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 921600
